body{margin:0;color:#c9d4e3;font-family:Spectral,Georgia,serif;background:

input[type=range][data-dual]::-webkit-slider-thumb{pointer-events:auto}
input[type=range][data-dual]::-moz-range-thumb{pointer-events:auto}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input:focus,button:focus{outline:1px solid rgba(217,176,106,.45);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#0a111e}::-webkit-scrollbar-thumb{background:#3d2f1a;border:2px solid #0a111e;border-radius:6px}

#loaderr{display:none;max-width:760px;margin:80px auto;padding:26px 30px;border:1px solid #6d5330;background:linear-gradient(165deg,#101a2d,#0b1322);color:#c9d4e3;font-family:Spectral,Georgia,serif;box-shadow:0 20px 44px rgba(0,0,0,.45)}
#loaderr h2{font-family:Cinzel,serif;letter-spacing:.2em;color:#ecd39a;font-size:16px;margin:0 0 12px}
#loaderr code{background:#0a1120;border:1px solid #4f3d22;color:#ecd39a;padding:2px 7px}
#loaderr p{line-height:1.55;color:#a8b4c7}

     script tag, so the dashboard also opens by double-click (file://). -->
<script src="dashboard_data.js" onerror="void 0"></script>
<script>
/* ── minimal Design-Composer runtime ──────────────────────────────────────
   Interprets {{ path }} interpolation, data-scfor / data-scif directives,
   onClick/onChange/onMouseEnter/onMouseLeave/onMouseMove bindings and style-hover, then
   reconciles the live DOM in place so inputs keep focus and sliders keep drag. */
(function(){
'use strict';
var SVG='http://www.w3.org/2000/svg';

function evalExpr(expr, scope){
  expr = expr.trim();
  if(expr==='true') return true;
  if(expr==='false') return false;
  if(expr==='null') return null;
  if(/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
  var parts = expr.split('.'), v = scope;
  for(var i=0;i<parts.length;i++){ if(v==null) return undefined; v = v[parts[i]]; }
  return v;
}
var BIND=/\{\{\s*([^}]*?)\s*\}\}/g;
function interpolate(str, scope){
  return str.replace(BIND, function(_,e){ var v=evalExpr(e,scope); return v==null?'':String(v); });
}
function singleBinding(str){
  var m = /^\{\{\s*([^}]*?)\s*\}\}$/.exec(str);
  return m ? m[1].trim() : null;
}

function renderChildren(node, scope, out){
  var kids = node.childNodes;
  for(var i=0;i<kids.length;i++) renderNode(kids[i], scope, out);
}
function renderNode(node, scope, out){
  if(node.nodeType===3){                       // text
    var t = node.nodeValue;
    out.appendChild(document.createTextNode(t.indexOf('{{')>=0 ? interpolate(t,scope) : t));
    return;
  }
  if(node.nodeType!==1) return;                // skip comments etc.
  if(node.hasAttribute('data-scif') && !evalExpr(node.getAttribute('data-scif'), scope)) return;
  if(node.hasAttribute('data-scfor')){
    var list = evalExpr(node.getAttribute('data-scfor'), scope) || [];
    var as = node.getAttribute('data-scas');
    for(var i=0;i<list.length;i++){
      var cs = Object.create(scope); cs[as] = list[i]; cs.$index = i;
      buildElement(node, cs, out);
    }
    return;
  }
  buildElement(node, scope, out);
}
var EVENTS = {onclick:1,oninput:1,onchange:1,onmouseenter:1,onmouseleave:1,onmousemove:1,onkeydown:1};
function buildElement(node, scope, out){
  var el = node.namespaceURI===SVG
    ? document.createElementNS(SVG, node.localName)
    : document.createElement(node.localName);
  var ev = {}, enters = [], leaves = [], hover = null, pendingVal, hasVal = false;
  var attrs = node.attributes;
  for(var k=0;k<attrs.length;k++){
    var name = attrs[k].name, raw = attrs[k].value, ln = name.toLowerCase();
    if(ln==='data-scfor'||ln==='data-scas'||ln==='data-scif') continue;
    if(ln.indexOf('hint-')===0||ln==='data-comment-anchor') continue;
    if(ln==='style-hover'){ hover = raw; continue; }
    if(EVENTS[ln]){
      var b = singleBinding(raw), fn = b!=null ? evalExpr(b, scope) : null;
      if(typeof fn==='function'){
        if(ln==='onmouseenter') enters.push(fn);
        else if(ln==='onmouseleave') leaves.push(fn);
        else if(ln==='onchange'){ var ty=(node.getAttribute('type')||'text').toLowerCase(); ev[ty==='number'?'change':'input']=fn; }
        else if(ln==='onclick') ev.click=fn;
        else if(ln==='oninput') ev.input=fn;
        else if(ln==='onkeydown') ev.keydown=fn;
        else if(ln==='onmousemove') ev.mousemove=fn;
      }
      continue;
    }
    if(ln==='value' && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT')){
      pendingVal = raw.indexOf('{{')>=0 ? interpolate(raw,scope) : raw; hasVal = true; continue;
    }
    el.setAttribute(name, raw.indexOf('{{')>=0 ? interpolate(raw,scope) : raw);
  }
  el.__baseStyle = el.getAttribute('style') || '';
  el.onclick   = ev.click   || null;
  el.oninput   = ev.input   || null;
  el.onchange  = ev.change  || null;
  el.onkeydown = ev.keydown || null;
  el.onmousemove = ev.mousemove || null;
  if(hover!=null){
    enters.push(function(){ this.setAttribute('style', (this.__baseStyle||'') + ';' + hover); });
    leaves.push(function(){ this.setAttribute('style', this.__baseStyle||''); });
  }
  el.onmouseenter = enters.length ? function(e){ for(var i=0;i<enters.length;i++) enters[i].call(this,e); } : null;
  el.onmouseleave = leaves.length ? function(e){ for(var i=0;i<leaves.length;i++) leaves[i].call(this,e); } : null;
  if(hasVal){ el.__val = pendingVal; el.value = pendingVal; }
  renderChildren(node, scope, el);
  out.appendChild(el);
}

/* ── in-place reconciliation ── */
var HANDLERS = ['onclick','oninput','onchange','onkeydown','onmouseenter','onmouseleave','onmousemove'];
function sameNode(a, b){
  if(a.nodeType!==b.nodeType) return false;
  if(a.nodeType!==1) return true;
  return a.namespaceURI===b.namespaceURI && a.tagName===b.tagName;
}
function morph(live, fresh){
  var fk = Array.prototype.slice.call(fresh.childNodes);
  var lk = Array.prototype.slice.call(live.childNodes);
  for(var i=0;i<fk.length;i++){
    var f = fk[i], l = lk[i];
    if(!l){ live.appendChild(f); continue; }
    if(sameNode(l, f)) patchNode(l, f);
    else live.replaceChild(f, l);
  }
  for(var j=lk.length-1;j>=fk.length;j--){ if(lk[j].parentNode===live) live.removeChild(lk[j]); }
}
function patchNode(l, f){
  if(l.nodeType===3){ if(l.nodeValue!==f.nodeValue) l.nodeValue = f.nodeValue; return; }
  if(l.nodeType!==1) return;
  // attributes
  for(var i=l.attributes.length-1;i>=0;i--){ var n=l.attributes[i].name; if(!f.hasAttribute(n)) l.removeAttribute(n); }
  for(var j=0;j<f.attributes.length;j++){ var a=f.attributes[j]; if(l.getAttribute(a.name)!==a.value) l.setAttribute(a.name,a.value); }
  // handlers + bound props
  for(var h=0;h<HANDLERS.length;h++){ var p=HANDLERS[h]; if(l[p]!==f[p]) l[p]=f[p]; }
  l.__baseStyle = f.__baseStyle;
  if(f.__val!==undefined){ l.__val=f.__val; if(l.value!==f.__val) l.value=f.__val; }
  morph(l, f);
}

/* ── component base: setState + rAF-batched render into #app ── */
function DCLogic(){}
DCLogic.prototype.setState = function(patch, cb){
  Object.assign(this.state, patch);
  if(cb) cb();
  if(!this._raf){ var self=this; this._raf = requestAnimationFrame(function(){ self._raf=0; self._render(); }); }
};
DCLogic.prototype.mount = function(tpl, app){
  this._tpl = tpl; this._app = app;
  if(this.componentDidMount) this.componentDidMount();
  this._render();
};
DCLogic.prototype._render = function(){
  var V = this.renderVals();
  var fresh = document.createElement('div');
  renderChildren(this._tpl, V, fresh);
  if(!this._mounted){
    while(this._app.firstChild) this._app.removeChild(this._app.firstChild);
    while(fresh.firstChild) this._app.appendChild(fresh.firstChild);
    this._mounted = true;
  } else morph(this._app, fresh);
};
window.DCLogic = DCLogic;
})();
</script>

    const ccy = c.currency ? ' '+c.currency : '';
    const h = hov && hov.k===key && hov.i<n ? hov.i : null;
    let readout = 'last '+f(c.close[last])+ccy+(chg==null ? '' : ' · '+(chg>=0?'+':'−')+Math.abs(chg).toFixed(1)+'% over the window')
      +(lf==null ? '' : ' · close '+(c.close[last]>lf ? 'above' : 'below')+' the 50-day');
    let hoverLine='', hoverDots='';
    if(h!=null){
      readout = this.dLong(c.dates[h])+' · close '+f(c.close[h])+ccy+' · 50d '+f(c.fast[h])+' · 200d '+f(c.slow[h]);
      hoverLine = 'M'+x(h).toFixed(1)+','+T+'V'+B;
      hoverDots = [c.close[h], c.fast[h], c.slow[h]].filter(v=>v!=null).map(v=>'M'+(x(h)+3).toFixed(1)+','+y(v).toFixed(1)+'a3,3 0 1,0 -6,0a3,3 0 1,0 6,0').join('');
    }
    return {k, ticker:c.ticker, symbol:c.symbol, readout, grid, yTicks, xTicks, golden, death, hoverLine, hoverDots,
      close:line(c.close), fast:line(c.fast), slow:line(c.slow),
      state: up==null ? 'not enough history' : up ? '▲ 50-day above 200-day' : '▼ 50-day below 200-day',
      stateColor: up==null ? '#68758c' : up ? '#8fd0a0' : '#d98a6a',
      move: e=>{ const r = e.currentTarget.getBoundingClientRect(); if(!r.width || n<2) return;
        const fx = (e.clientX-r.left)/r.width*W;
        const i = Math.max(0, Math.min(n-1, Math.round((fx-L)/(R-L)*(n-1))));
        const cur = this.state.pxHover; if(!cur || cur.k!==key || cur.i!==i) this.setState({pxHover:{k:key, i}}); }};
  }
  roman(n){ let out=''; [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']].forEach(([v,r])=>{ while(n>=v){ out+=r; n-=v; } }); return out; }
  pts(arr){ return arr.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '); }

  renderVals(){
    const S = this.state, data = S.data;
    const mcRuns = this.props.mcRuns ?? 1000;
    const showMilestones = this.props.showMilestones ?? true;
    const tableRows = this.props.tableRows ?? 12;
    const V = {};
    V.headerYear = this.roman(data ? +data.meta.date_max.slice(0,4) : new Date().getFullYear());
    V.q = S.q; V.span = S.span; V.dFrom = S.dFrom; V.dTo = S.dTo;
    V.aMin = S.aMin; V.aMax = S.aMax; V.amtFloor = S.amtFloor; V.amtCeil = S.amtCeil;
    V.mc = S.mc; V.showMilestones = showMilestones; V.nwStacked = S.nwStacked;
    V.setQ = e=>this.setState({q: e.target.value, rowsShown: 0});
    V.setDFrom = e=>{ const v=+e.target.value; this.setState({dFrom: Math.min(v, S.dTo)}); };
    V.setDTo = e=>{ const v=+e.target.value; this.setState({dTo: Math.max(v, S.dFrom)}); };
    V.setAMin = e=>{ const v=+e.target.value; this.setState({aMin: Math.min(v, S.aMax)}); };
    V.setAMax = e=>{ const v=+e.target.value; this.setState({aMax: Math.max(v, S.aMin)}); };
    V.reset = ()=>this.setState({cats:[], tagSel:[], q:'', dFrom:0, dTo:S.span, aMin:S.amtFloor, aMax:S.amtCeil, rowsShown:0, sortKey:'date', sortDir:-1});
    V.viewTotals = ()=>this.setState({view:'totals'});
    V.viewTrend = ()=>this.setState({view:'trend'});
    const selOn = {bg:'rgba(127,180,216,.16)', fg:'#bcd9ef', bd:'#5d86b0'};
    V.totalsBg = S.view==='totals'?selOn.bg:'transparent'; V.totalsFg = S.view==='totals'?selOn.fg:'#7e8ba0';
    V.trendBg = S.view==='trend'?selOn.bg:'transparent'; V.trendFg = S.view==='trend'?selOn.fg:'#7e8ba0';
    V.showTotals = S.view==='totals'; V.showTrend = S.view==='trend';

    const allCats = data ? data.meta.expense_categories : Object.keys(this.CATC);
    // While transfers are hidden, `investment` isn't a chip you can select —
    // the dashed chip beside the row toggles the whole class of rows instead.
    const visCats = S.exInv ? allCats.filter(c=>c!==this.XFER) : allCats;
    V.hasXfer = allCats.includes(this.XFER);
    V.xferLabel = S.exInv ? '+ investment' : '− investment';
    V.xferBg = S.exInv ? 'rgba(255,255,255,.02)' : 'rgba(20,184,166,.14)';
    V.xferFg = S.exInv ? '#5f6b7e' : '#7fe3d5';
    V.xferBd = S.exInv ? '#3a3020' : '#14b8a6';
    V.xferToggle = ()=>this.setState(
      {exInv: !S.exInv, cats: S.cats.filter(c=>c!==this.XFER), rowsShown:0}, ()=>this.persist());
    V.catChips = visCats.map(c=>{
      const on = S.cats.includes(c);
      return {name:c, toggle:()=>{ const cats = on ? S.cats.filter(x=>x!==c) : S.cats.concat(c); this.setState({cats, rowsShown:0}); },
        bg: on?'rgba(127,180,216,.15)':'rgba(255,255,255,.02)', fg: on?'#bcd9ef':'#7e8ba0', bd: on?'#5d86b0':'#3a3020'};
    });
    const allTags = data ? data.meta.expense_tags : [];
    V.tagChips = allTags.map(t=>{
      const on = S.tagSel.includes(t);
      return {name:t, toggle:()=>{ const tagSel = on ? S.tagSel.filter(x=>x!==t) : S.tagSel.concat(t); this.setState({tagSel, rowsShown:0}); },
        bg: on?'rgba(217,176,106,.16)':'rgba(255,255,255,.02)', fg: on?'#ecd39a':'#7e8ba0', bd: on?'#a97f45':'#3a3020'};
    });

    const dayDate = n=>{ if(!data) return ''; const d = new Date(this.pd(data.meta.date_min).getTime()+n*864e5); return d.getUTCDate()+' '+this.MN[d.getUTCMonth()]; };
    V.dateLabel = data ? dayDate(S.dFrom)+' – '+dayDate(S.dTo) : '';
    V.amtLabel = 'S$'+S.aMin+' – S$'+S.aMax;

    const rows = this.filterRows(true);
    const toks = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    V.matchInfo = toks.length ? rows.length+' entries match "'+S.q.trim()+'"' : 'search merged notes · space = AND';
    const parts = [];
    if(S.cats.length) parts.push('highlighting '+S.cats.length+' categor'+(S.cats.length>1?'ies':'y'));
    if(toks.length) parts.push('keyword “'+S.q.trim()+'”');
    if(S.tagSel.length) parts.push('tag'+(S.tagSel.length>1?'s':'')+' '+S.tagSel.join(', '));
    if(data && (S.dFrom>0 || S.dTo<S.span)) parts.push('dates '+V.dateLabel);
    if(S.aMin>S.amtFloor || S.aMax<S.amtCeil) parts.push('amounts '+V.amtLabel);
    V.activeSummary = parts.length ? 'Active filters — '+parts.join(' · ') : 'No filters active — showing every recorded expense.';

    const total = rows.reduce((a,e)=>a+e.amount,0);
    V.txTotal = this.fmt(total); V.txCount = rows.length;
    V.txAvg = rows.length ? this.fmt(total/rows.length) : '—';
    V.noRows = data && rows.length===0; V.hasRows = !data || rows.length>0;

    const sorted = rows.slice().sort((a,b)=>{
      const k = S.sortKey, d = S.sortDir;
      if(k==='amount') return (a.amount-b.amount)*d;
      if(k==='note') return String(a.note||'').localeCompare(String(b.note||''))*d;
      if(k==='category') return a.category.localeCompare(b.category)*d || (a.date<b.date?1:-1);
      return (a.date<b.date?-1:a.date>b.date?1:0)*d;
    });
    const nShown = Math.min(sorted.length, (S.rowsShown||tableRows));
    V.txRows = sorted.slice(0,nShown).map(e=>({
      date: e.date.slice(8,10)+' '+this.MN[+e.date.slice(5,7)-1], cat: e.category, color: this.CATC[e.category]||'#8a7a5e',
      amtF: this.fmt(e.amount), amtColor: e.amount<0?'#8ab6d9':'#dfe7f2', note: e.note||'—',
      bg: S.cats.includes(e.category) ? 'rgba(127,180,216,.08)' : 'transparent'
    }));
    V.shownInfo = 'showing '+nShown+' of '+sorted.length;
    V.moreAvailable = sorted.length > nShown;
    V.showMore = ()=>this.setState({rowsShown: nShown+20});
    const mkSort = k=>()=>this.setState({sortKey:k, sortDir: S.sortKey===k ? -S.sortDir : (k==='date'||k==='amount'?-1:1)});
    V.sortDate = mkSort('date'); V.sortCat = mkSort('category'); V.sortAmt = mkSort('amount'); V.sortNote = mkSort('note');
    V.arrDate = S.sortKey==='date'?(S.sortDir>0?'▲':'▼'):''; V.arrCat = S.sortKey==='category'?(S.sortDir>0?'▲':'▼'):'';
    V.arrAmt = S.sortKey==='amount'?(S.sortDir>0?'▲':'▼'):''; V.arrNote = S.sortKey==='note'?(S.sortDir>0?'▲':'▼'):'';

    // bars + trend — chips highlight, never hide
    const shownCats = visCats;
    const anySel = S.cats.length > 0;
    const byCatRows = rows;
    const catTotals = shownCats.map(c=>({name:c, amt: byCatRows.filter(e=>e.category===c).reduce((a,e)=>a+e.amount,0)}))
      .sort((a,b)=>b.amt-a.amt);
    const sumSel = catTotals.reduce((a,c)=>a+c.amt,0) || 1;
    const maxCat = Math.max(1, ...catTotals.map(c=>c.amt));
    V.barItems = catTotals.map(c=>{
      const col = this.CATC[c.name]||'#8a7a5e', sel = S.cats.includes(c.name);
      return {name:c.name, color:col, amtF:this.fmt(c.amt),
        share: Math.round(c.amt/sumSel*100), w: Math.max(0, c.amt/maxCat*100).toFixed(1),
        shadow: sel ? '0 0 16px '+col+'cc, 0 0 5px '+col : '0 0 10px '+col+'44',
        op: anySel && !sel ? '0.35' : '1', filter: sel ? 'brightness(1.25)' : 'none'};
    });

    const mkeys = data ? this.monthKeys(data) : [];
    V.trendMonths = mkeys.map(k=>({label: this.MN[+k.slice(5,7)-1]}));
    const seriesData = shownCats.map(c=>mkeys.map(k=>byCatRows.filter(e=>e.category===c && e.date.slice(0,7)===k).reduce((a,e)=>a+e.amount,0)));
    const tmax = Math.max(1, ...seriesData.flat());
    const trend = {};
    for(let i=0;i<12;i++){ trend['p'+i]=''; trend['c'+i]='none'; trend['w'+i]='2'; trend['o'+i]='1'; trend['f'+i]='none'; }
    shownCats.slice(0,12).forEach((c,i)=>{
      const n = mkeys.length;
      const col = this.CATC[c]||'#8a7a5e', sel = S.cats.includes(c);
      trend['p'+i] = this.pts(seriesData[i].map((v,j)=>[14+(760-28)*(n>1?j/(n-1):0), 12+(230-26)*(1-v/tmax)]));
      trend['c'+i] = col;
      trend['w'+i] = sel ? '3' : '2';
      trend['o'+i] = anySel && !sel ? '0.28' : '1';
      trend['f'+i] = sel ? 'drop-shadow(0 0 4px '+col+')' : 'none';
    });
    V.trend = trend;
    V.trendGrid = [0,.25,.5,.75,1].map(f=>{ const y=12+(230-26)*f; return 'M14 '+y.toFixed(1)+' H746'; }).join(' ');
    V.trendLegend = shownCats.slice(0,12).map(c=>{
      const col = this.CATC[c]||'#8a7a5e', sel = S.cats.includes(c);
      return {name:c, color:col, op: anySel && !sel ? '0.35' : '1', glow: sel ? '0 0 8px '+col : 'none'};
    });

    // ── summary medallions ──
    const am = this.assetMonths();
    // Headline figures, the allocation and the projections start from the newest
    // *complete* snapshot: one still waiting on a statement understates the total.
    const whole = am.filter(m=>!m.missing.length);
    const base = whole.length ? whole : am;
    const latest = base[base.length-1], prev = base[base.length-2];
    const newest = am[am.length-1];
    const behind = latest && newest && newest !== latest ? ' · '+this.MN[+newest.key.slice(5,7)-1]+' incomplete' : '';
    const nwNow = latest ? latest.total : 0;
    const delta = latest && prev ? latest.total - prev.total : 0;
    // A snapshot still waiting on a statement understates the total, so a
    // month-on-month change measured against it would be fiction.
    const nwGap = !!((latest && latest.missing.length) || (prev && prev.missing.length));
    // Burn rate is consumption only — investment transfers never count.
    const spendRows = data ? data.expenses.filter(e=>e.category!==this.XFER) : [];
    const allSpent = spendRows.reduce((a,e)=>a+e.amount,0);
    const recentKeys = data ? this.fullKeys(data).slice(-6) : [];
    const recentSpent = spendRows.filter(e=>recentKeys.includes(e.date.slice(0,7))).reduce((a,e)=>a+e.amount,0);
    const avgSpend = recentKeys.length ? recentSpent/recentKeys.length : 0;
    const hasInv = data ? data.expenses.some(e=>e.category===this.XFER) : false;
    const inc = S.inc||0, spend = S.spend||0, sav = inc - spend;
    V.medallions = [
      {label:'NET WORTH', value:this.fmtK(nwNow), sub: latest? 'in '+this.MN[+latest.key.slice(5,7)-1]+' '+latest.key.slice(0,4)+(latest.missing.length?' · incomplete':behind):'—', color:'#ecd39a', isChest:true, isScale:false, isLoom:false, isBag:false, scaleTransform:''},
      {label:'GROWTH', value: nwGap ? '—' : (delta>=0?'+':'')+this.fmtK(delta), sub: nwGap ? 'awaiting a complete snapshot' : 'vs previous month', color: nwGap ? '#68758c' : delta>=0?'#8fd0a0':'#d98a6a', isChest:false, isScale:true, isLoom:false, isBag:false, scaleTransform:'rotate('+(delta>=0?-10:10)+' 40 26)'},
      {label:'AVG SPEND', value:this.fmtK(avgSpend), sub:'per month · last '+recentKeys.length+' mo'+(hasInv?' · excl. investment':''), color:'#d9b06a', isChest:false, isScale:false, isLoom:true, isBag:false, scaleTransform:''}
    ];

    // ── balance-scale geometry: beam tilts, pans stay level ──
    { const sa=(delta>=0?-10:10)*Math.PI/180, cs=Math.cos(sa), sn=Math.sin(sa), rn=n=>Math.round(n*10)/10;
      const lx=rn(40-24*cs), ly=rn(26-24*sn), rx=rn(40+24*cs), ry=rn(26+24*sn), cl=12;
      const pan=(cx,ey)=>({c1:'M'+cx+' '+ey+' L'+(cx-7)+' '+(ey+cl), c2:'M'+cx+' '+ey+' L'+(cx+7)+' '+(ey+cl),
        rim:'M'+(cx-8)+' '+(ey+cl)+' H'+(cx+8), bowl:'M'+(cx-8)+' '+(ey+cl)+' Q'+cx+' '+(ey+cl+8)+' '+(cx+8)+' '+(ey+cl)});
      const pL=pan(lx,ly), pR=pan(rx,ry);
      V.scaleGeo = {beam:'M'+lx+' '+ly+' L'+rx+' '+ry, lc1:pL.c1,lc2:pL.c2,lrim:pL.rim,lbowl:pL.bowl, rc1:pR.c1,rc2:pR.c2,rrim:pR.rim,rbowl:pR.bowl};
    }

    // ── projections ──
    const cash0 = latest ? latest.cash : 0;
    const inv0 = latest ? latest.total - latest.cash : 0;
    const months = Math.round(S.horizon*12);
    const retEff = S.inflOn ? ((1+S.ret/100)/(1+S.infl/100)-1)*100 : S.ret;
    const rm = Math.pow(1+retEff/100, 1/12)-1;
    const ip = S.investPct/100;
    const fi = S.swr>0 ? spend*12/(S.swr/100) : 0;
    const det = this.runDet(cash0, inv0, inc, spend, ip, rm, months);

    V.projInputs = [
      {label:'TAKE-HOME INCOME / MO', min:0, max:20000, step:50, val:S.inc??0, unit:'S$', set:this.setNum('inc',0,20000)},
      {label:'SPENDING / MO', min:0, max:10000, step:50, val:S.spend??0, unit:'S$', set:this.setNum('spend',0,10000)},
      {label:'SAVINGS INVESTED', min:0, max:100, step:5, val:S.investPct, unit:'%', set:this.setNum('investPct',0,100)},
      {label:'COMPOUND RETURN / YR', min:0, max:12, step:0.1, val:S.ret, unit:'%', set:this.setNum('ret',0,12)},
      {label:'VOLATILITY σ / YR', min:0, max:40, step:1, val:S.vol, unit:'%', set:this.setNum('vol',0,40)},
      // Moving the retirement length re-derives the SWR; the SWR stays editable.
      {label:'RETIREMENT LENGTH', min:30, max:60, step:1, val:S.retireYears, unit:'yrs', set:e=>{
        let v = parseFloat(e.target.value); if(isNaN(v)) v = 50; v = Math.min(60, Math.max(30, v));
        this.setState({retireYears: v, swr: this.swrFor(v)}, ()=>this.persist()); }},
      {label:'SAFE WITHDRAWAL RATE', min:2.5, max:5, step:0.1, val:S.swr, unit:'%', set:this.setNum('swr',2.5,5)},
      {label:'INFLATION / YR', min:0, max:6, step:0.1, val:S.infl, unit:'%', set:this.setNum('infl',0,6)},
      {label:'HORIZON', min:5, max:50, step:1, val:S.horizon, unit:'yrs', set:this.setNum('horizon',5,50)},
      {label:'COAST TARGET', min:5, max:50, step:1, val:S.coastYears, unit:'yrs', set:this.setNum('coastYears',5,50)}
    ];
    V.savingsF = (sav>=0?'+':'')+this.fmt0(sav)+' / mo';
    V.savingsColor = sav>=0?'#8fd0a0':'#d98a6a';
    V.savingsBd = sav>=0?'rgba(143,208,160,.3)':'rgba(217,138,106,.45)';
    V.savingsBg = sav>=0?'rgba(143,208,160,.05)':'rgba(217,138,106,.07)';
    // What the ledger actually says you invested lately: money sent to the
    // broker minus anything swept back to savings, per month over the last 3
    // complete months. Shown next to the modelled figure so the assumption can
    // be checked against reality.
    const last3 = data ? this.fullKeys(data).slice(-3) : [];
    const netInvMo = last3.length ? this.netInvest(data, last3)/last3.length : 0;
    const backMo = last3.length && data.income
      ? data.income.filter(e=>e.category===this.XFER && last3.includes(e.date.slice(0,7)))
          .reduce((a,e)=>a+e.amount,0)/last3.length : 0;
    V.savingsNote = sav>=0 ? Math.round(ip*100)+'% invested, rest to cash' : 'burning the vault — runway mode';
    V.hasNetInv = netInvMo !== 0 || backMo !== 0;
    V.netInvNote = 'ledger says ' + this.fmt0(netInvMo) + '/mo actually invested'
      + (backMo ? ' (' + this.fmt0(backMo) + '/mo swept back netted off)' : '')
      + ' · last ' + last3.length + ' mo';
    V.resetProj = ()=>this.resetProj();
    // Where the defaults came from, so a nudged slider can be judged against it.
    const sm = data ? this.spendModel(data) : null, al = data ? this.allocDefaults(data) : null;
    V.hasDefNote = !!(sm || al);
    V.defNote = [
      sm ? 'ledger spend ≈ '+this.fmt0(sm.spend)+' ± '+this.fmt0(sm.se)+'/mo: everyday '+this.fmt0(sm.everyday)+' (recent months weighted) + one-offs '+this.fmt0(sm.lumpy)+' spread over '+sm.n+' mo' : '',
      al ? 'return & σ from your '+Math.round(al.stockShare*100)+'/'+(100-Math.round(al.stockShare*100))+' stocks/bonds mix · SWR from retirement length' : ''
    ].filter(Boolean).join(' · ');
    V.mcOn = ()=>this.setState({mc:true}, ()=>this.persist());
    V.mcOff = ()=>this.setState({mc:false}, ()=>this.persist());
    V.detBg = !S.mc?selOn.bg:'transparent'; V.detFg = !S.mc?selOn.fg:'#7e8ba0';
    V.mcBg = S.mc?selOn.bg:'transparent'; V.mcFg = S.mc?selOn.fg:'#7e8ba0';
    V.toggleInfl = ()=>this.setState({inflOn: !S.inflOn}, ()=>this.persist());
    V.inflBg = S.inflOn?'rgba(127,180,216,.14)':'transparent';
    V.inflFg = S.inflOn?'#bcd9ef':'#7e8ba0';
    V.inflLabel = S.inflOn ? 'REAL TERMS · INFLATION-ADJUSTED ✦' : 'NOMINAL TERMS · TAP FOR REAL';

    V.fiF = this.fmtK(fi);
    V.fiFormula = this.fmt0(spend*12)+'/yr ÷ '+S.swr+'% SWR';
    const fiPct = fi>0 ? nwNow/fi*100 : 0;
    V.fiPct = fiPct.toFixed(1); V.fiPctW = Math.min(100, fiPct).toFixed(1);

    const mcd = (S.mc && S.mcData) ? S.mcData : null;
    const lineArr = mcd ? mcd.p50 : det.tot;
    const startDate = latest ? this.pd(latest.key+'-01') : new Date();
    const dateAt = t=>{ const d = new Date(Date.UTC(startDate.getUTCFullYear(), startDate.getUTCMonth()+t, 1)); return this.MN[d.getUTCMonth()]+' '+d.getUTCFullYear(); };
    const yearAt = t=> new Date(Date.UTC(startDate.getUTCFullYear(), startDate.getUTCMonth()+t, 1)).getUTCFullYear();
    let fiT = null; for(let t=0;t<lineArr.length;t++){ if(lineArr[t]>=fi){ fiT=t; break; } }
    if(sav<0 && nwNow<fi) {
      const dep = mcd ? (()=>{ for(let t=0;t<mcd.p50.length;t++) if(mcd.p50[t]<=0) return t; return null; })() : det.depleted;
      V.verdictLabel = 'RUNWAY';
      if(dep){ V.verdictMain = (dep/12).toFixed(1)+' years'; V.verdictSub = 'vault lasts until '+dateAt(dep)+' at this burn'; V.verdictColor = '#d98a6a'; }
      else { V.verdictMain = '> '+S.horizon+' years'; V.verdictSub = 'vault outlasts the horizon even while burning'; V.verdictColor = '#d9b06a'; }
    } else {
      V.verdictLabel = 'YEARS TO FI';
      if(fiT===0){ V.verdictMain='Already there'; V.verdictSub='net worth exceeds the FI number'; V.verdictColor='#8fd0a0'; }
      else if(fiT){ V.verdictMain=(fiT/12).toFixed(1)+' years'; V.verdictSub='crossing in '+dateAt(fiT); V.verdictColor='#8fd0a0'; }
      else { V.verdictMain='Not in horizon'; V.verdictSub='FI not reached within '+S.horizon+' years — honestly'; V.verdictColor='#d98a6a'; }
    }
    V.mcProb = mcd ? mcd.prob+'%' : '…';
    V.projLegend = mcd ? 'projected (median of '+mcRuns+' runs)' : 'projected';

    // MC scheduling
    const sig = [inc,spend,S.investPct,retEff,S.vol,S.swr,S.horizon,mcRuns,cash0.toFixed(0),inv0.toFixed(0),fi.toFixed(0)].join('|');
    this.maybeMC(sig, {runs: mcRuns, months, rm, vol:S.vol, cash0, inv0, ip, sav, fi});

    // projection chart geometry
    const W=980, Hh=330, L=64, R=14, T=14, B=30;
    const histVals = am.map(m=>m.total);
    const Hn = Math.max(1, histVals.length);
    const N = (Hn-1) + months;
    const maxLine = Math.max(...lineArr, ...histVals, 1);
    const p90max = mcd ? Math.max(...mcd.p90) : 0;
    const showFiLine = fi>0 && Math.max(maxLine, p90max) >= fi*0.25;
    const ymax = Math.max(maxLine, p90max, showFiLine?fi*1.06:0) * 1.04;
    const X = i=> L + (W-L-R)*i/Math.max(1,N);
    const Y = v=> T + (Hh-T-B)*(1-Math.max(0,v)/ymax);
    V.pHist = this.pts(histVals.map((v,i)=>[X(i), Y(v)]));
    const step = Math.max(1, Math.ceil(months/260));
    const projPts = []; for(let t=0;t<lineArr.length;t+=step) projPts.push([X(Hn-1+t), Y(lineArr[t])]);
    if((lineArr.length-1)%step!==0) projPts.push([X(Hn-1+lineArr.length-1), Y(lineArr[lineArr.length-1])]);
    V.pProj = this.pts(projPts);
    if(mcd){
      const b10=[],b90=[];
      for(let t=0;t<mcd.p10.length;t+=step){ b10.push([X(Hn-1+t), Y(mcd.p10[t])]); b90.push([X(Hn-1+t), Y(mcd.p90[t])]); }
      V.pBand = this.pts(b90.concat(b10.slice().reverse()));
      V.pP10 = this.pts(b10); V.pP90 = this.pts(b90);
    } else { V.pBand=''; V.pP10=''; V.pP90=''; }
    const gstep = this.nice(ymax/4);
    let gp=''; const yt=[];
    for(let v=gstep; v<=ymax; v+=gstep){ const y=Y(v); gp+='M'+L+' '+y.toFixed(1)+' H'+(W-R)+' '; yt.push({pct:(y/Hh*100).toFixed(1), label:this.fmtK(v)}); }
    V.pGrid = gp; V.pYTicks = yt;
    const yrStep = S.horizon<=12?2 : S.horizon<=25?5 : 10;
    const xt=[]; const y0=yearAt(0);
    xt.push({pct:(X(0)/W*100).toFixed(1), label:String(y0)});
    for(let y=y0+yrStep; y<=y0+S.horizon; y+=yrStep){ const t=(y-y0)*12 - startDate.getUTCMonth(); if(t>0 && t<=months) xt.push({pct:(X(Hn-1+t)/W*100).toFixed(1), label:String(y)}); }
    V.pXTicks = xt;
    V.pFiY = Y(fi).toFixed(1); V.pFiX1 = L; V.pFiX2 = W-R;
    V.pFiOp = showFiLine ? 0.9 : 0; V.pFiLabelPct = (Y(fi)/Hh*100).toFixed(1);

    // milestones
    const findT = amt=>{ for(let t=0;t<lineArr.length;t++) if(lineArr[t]>=amt) return t; return null; };
    const msDefs = [];
    if(spend>0) msDefs.push({name:'1 year of expenses', amt:12*spend, color:'#8ab6d9'});
    const r1 = Math.ceil((nwNow+1)/50000)*50000;
    const rounds = [r1]; let rn = Math.ceil((r1+1)/100000)*100000;
    while(rounds.length<4 && rn<=Math.max(fi, ymax)){ rounds.push(rn); rn+=100000; }
    rounds.forEach(r=>msDefs.push({name:'Vault reaches', amt:r, color:'#d9b06a'}));
    const coastM = Math.round(S.coastYears*12);
    const coastNow = rm>0 ? fi/Math.pow(1+rm, coastM) : fi;
    let coastT = null;
    for(let t=0;t<Math.min(lineArr.length, coastM);t++){ const need = rm>0 ? fi/Math.pow(1+rm, coastM-t) : fi; if(lineArr[t]>=need){ coastT=t; break; } }
    msDefs.push({name:'Coast FI — saving becomes optional', amt:coastNow, color:'#7fb4d8', coast:true});
    const marks = [];
    V.milestones = msDefs.map(d=>{
      const t = d.coast ? coastT : findT(d.amt);
      let when;
      if(t===0) when = 'already reached';
      else if(t!=null){ when = 'crossed '+dateAt(t)+' · '+(t/12).toFixed(1)+' yrs'; marks.push([X(Hn-1+t), Y(d.coast?lineArr[t]:d.amt)]); }
      else when = 'beyond the horizon';
      return {name:d.name, amtF:this.fmtK(d.amt), when, color:d.color};
    });
    if(fiT && fiT>0) marks.push([X(Hn-1+fiT), Y(fi)]);
    V.pMarks = showMilestones ? marks.map(m=>'M'+m[0].toFixed(1)+' '+(m[1]-6).toFixed(1)+' l6 6 l-6 6 l-6 -6 z').join(' ') : '';
    V.caveat = 'A divination, not advice — defaults rest on only ~'+(data?this.fullKeys(data).length:0)+' full months of records. Inputs persist in this browser.';

    // ── net worth card ──
    const nW=700, nH=250, nL=54, nR=16, nT=12, nB=10;
    const nmax = Math.max(1, ...am.map(m=>m.total))*1.08;
    const nX = i=> nL + (nW-nL-nR)*(am.length>1 ? i/(am.length-1) : 0);
    const nY = v=> nT + (nH-nT-nB)*(1-v/nmax);
    const nw = {line:'', dots:'', a0:'',a1:'',a2:'',a3:'',a4:'', k0:'none',k1:'none',k2:'none',k3:'none',k4:'none'};
    const noop = ()=>{};
    for(let i=0;i<5;i++){ nw['o'+i]='0.85'; nw['f'+i]='none'; nw['e'+i]=noop; }
    V.nwLeave = ()=>this.setState({hoverAsset:null});
    nw.line = this.pts(am.map((m,i)=>[nX(i), nY(m.total)]));
    nw.dots = am.map((m,i)=>{ const x=nX(i), y=nY(m.total); return 'M'+x.toFixed(1)+' '+(y-4).toFixed(1)+' l4 4 l-4 4 l-4 -4 z'; }).join(' ');
    const acats = data ? data.meta.asset_categories : [];
    if(S.nwStacked && am.length){
      let base = am.map(()=>0);
      acats.slice(0,5).forEach((c,ci)=>{
        const topv = am.map((m,i)=>base[i]+(m.cats[c]||0));
        const top = topv.map((v,i)=>[nX(i), nY(v)]);
        const bot = base.map((v,i)=>[nX(i), nY(v)]).reverse();
        nw['a'+ci] = this.pts(top.concat(bot));
        nw['k'+ci] = this.ASSC[c]||'#8a7a5e';
        nw['o'+ci] = S.hoverAsset ? (S.hoverAsset===c ? '1' : '0.4') : '0.85';
        nw['f'+ci] = S.hoverAsset===c ? 'drop-shadow(0 0 6px '+(this.ASSC[c]||'#8a7a5e')+')' : 'none';
        nw['e'+ci] = ()=>this.setState({hoverAsset:c});
        base = topv;
      });
      nw.line=''; nw.dots='';
    }
    V.nw = nw;
    let ngp=''; const nyt=[]; const ngstep=this.nice(nmax/3);
    for(let v=ngstep; v<=nmax; v+=ngstep){ const y=nY(v); ngp+='M'+nL+' '+y.toFixed(1)+' H'+(nW-nR)+' '; nyt.push({pct:(y/nH*100).toFixed(1), label:this.fmtK(v)}); }
    V.nwGrid = ngp; V.nwYTicks = nyt;
    V.nwMonths = am.map(m=>({label: this.MN[+m.key.slice(5,7)-1] + (m.missing.length?'*':'')}));
    const partialMs = am.filter(m=>m.missing.length);
    V.nwPartial = partialMs.length>0;
    V.nwPartialNote = '* ' + partialMs.map(m=>this.MN[+m.key.slice(5,7)-1]+' '+m.key.slice(0,4)+' is still missing '
      + m.missing.map(c=>c.replace('_',' ')).join(' and ')).join('; ')
      + ' — the total shown there is understated, not a real fall.';
    V.nwLine = ()=>this.setState({nwStacked:false});
    V.nwStack = ()=>this.setState({nwStacked:true});
    V.nwLineBg = !S.nwStacked?selOn.bg:'transparent'; V.nwLineFg = !S.nwStacked?selOn.fg:'#7e8ba0';
    V.nwStackBg = S.nwStacked?selOn.bg:'transparent'; V.nwStackFg = S.nwStacked?selOn.fg:'#7e8ba0';
    V.assetLegend = acats.map(c=>({name:c.replace('_',' '), color:this.ASSC[c]||'#8a7a5e',
      txt: S.hoverAsset===c ? '#e8f1fa' : '#a8b4c7',
      glow: S.hoverAsset===c ? '0 0 8px '+(this.ASSC[c]||'#8a7a5e') : 'none',
      enter: ()=>this.setState({hoverAsset:c}), leave: ()=>this.setState({hoverAsset:null})}));

    // ── asset breakdown ──
    const amax = Math.max(1, ...am.map(m=>m.total));
    V.assetBars = am.map(m=>({label:this.MN[+m.key.slice(5,7)-1] + (m.missing.length?'*':''), h:(m.total/amax*100).toFixed(1),
      segs: acats.map(c=>{ const col=this.ASSC[c]||'#8a7a5e'; return {h: m.total>0?((m.cats[c]||0)/m.total*100).toFixed(2):0, color:'linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%,rgba(0,0,0,.28)),'+col,
        filter: S.hoverAsset===c ? 'brightness(1.3)' : 'none',
        enter: ()=>this.setState({hoverAsset:c}), leave: ()=>this.setState({hoverAsset:null})}; })}));
    V.latestMonthLabel = latest ? this.MN[+latest.key.slice(5,7)-1].toUpperCase()+' '+latest.key.slice(0,4) : '—';
    V.latestPartial = !!(latest && latest.missing.length);
    V.latestPartialNote = V.latestPartial ? 'Still awaiting ' + latest.missing.map(c=>c.replace('_',' ')).join(' and ')
      + ' — these shares are of an incomplete total.' : '';
    V.allocation = latest ? acats.map(c=>({name:c.replace('_',' '),
      enter: ()=>this.setState({hoverAsset:c}), leave: ()=>this.setState({hoverAsset:null}),
      shadow: S.hoverAsset===c ? '0 0 18px '+(this.ASSC[c]||'#8a7a5e')+'cc, 0 0 6px '+(this.ASSC[c]||'#8a7a5e') : '0 0 10px '+(this.ASSC[c]||'#8a7a5e')+'44',
      filter: S.hoverAsset===c ? 'brightness(1.35)' : 'none',
      color:'linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%),linear-gradient(90deg,'+(this.ASSC[c]||'#8a7a5e')+'66,'+(this.ASSC[c]||'#8a7a5e')+')',
      amtF:this.fmt0(latest.cats[c]||0), pct: (100*(latest.cats[c]||0)/latest.total).toFixed(1)}))
      .sort((a,b)=>b.pct-a.pct) : [];

    // holdings drill-down (ticker-tagged stocks_foreign rows, 2026-07 onward)
    const hRows = (data && latest) ? data.assets.filter(a=>a.date===latest.date && a.category==='stocks_foreign' && a.tags) : [];
    V.holdingsAvail = hRows.length>0;
    V.showHoldings = S.showHoldings;
    V.toggleHoldings = ()=>this.setState({showHoldings: !S.showHoldings});
    V.holdingsLabel = (S.showHoldings?'▾ ':'▸ ')+'FOREIGN STOCKS · '+hRows.length+' HOLDINGS';
    const hSum = hRows.reduce((a,r)=>a+r.amount,0)||1;
    // Every snapshot's note carries that month's quantity, close price and
    // average cost, so the whole cost-basis-vs-market-value history is already
    // in the data — parse it back out and sparkline it per ticker. Both series
    // are in the holding's own currency, so they stay comparable across months
    // without dragging the USD→SGD rate into it.
    const hSeries = {};
    (data ? data.assets : []).forEach(a=>{
      if(a.category!=='stocks_foreign' || !a.tags) return;
      const qc = (a.note||'').match(/:\s*([\d.]+)\s+@\s+[A-Z]{3}\s+([\d.]+)/);
      const av = (a.note||'').match(/avg\s+([\d.]+)/);
      if(!qc || !av) return;
      const qty = parseFloat(qc[1]);
      (hSeries[a.tags]=hSeries[a.tags]||[]).push({date:a.date, mv:qty*parseFloat(qc[2]), cb:qty*parseFloat(av[1])});
    });
    Object.values(hSeries).forEach(s=>s.sort((a,b)=>a.date<b.date?-1:1));
    const spW=110, spH=26, spP=3;
    V.holdings = hRows.slice().sort((a,b)=>b.amount-a.amount).map(r=>{
      const parts = (r.note||'').split(';').map(s=>s.trim());
      const plM = (r.note||'').match(/P&L\s*([+-][\d.]+)/);
      const pl = plM ? parseFloat(plM[1]) : null;
      const ser = hSeries[r.tags] || [];
      let mvPts='', cbPts='';
      if(ser.length>1){
        const vals = ser.reduce((a,p)=>a.concat([p.mv,p.cb]),[]);
        const lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), rng=(hi-lo)||1;
        const sx = i=>(spW*i/(ser.length-1)).toFixed(1);
        const sy = v=>(spP+(spH-2*spP)*(1-(v-lo)/rng)).toFixed(1);
        mvPts = ser.map((p,i)=>sx(i)+','+sy(p.mv)).join(' ');
        cbPts = ser.map((p,i)=>sx(i)+','+sy(p.cb)).join(' ');
      }
      return {ticker: r.tags.toUpperCase(), desc: parts.filter(p=>!/^P&L/.test(p)).join(' · '),
        mvPts, cbPts,
        share: (r.amount/hSum*100).toFixed(1), amtF: this.fmt0(r.amount),
        pl: pl==null ? '—' : (pl>=0?'+':'−')+Math.abs(pl).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),
        plColor: pl==null ? '#68758c' : pl>=0 ? '#8fd0a0' : '#d98a6a'};
    });


    // ── price trends (data.prices, saved by scripts/ma_cross_alert.py) ──
    const PX = data && data.prices;
    V.pxNone = !!data && !(PX && ((PX.holdings||[]).length || (PX.watchlist||[]).length));
    V.pxFastLabel = (PX ? PX.fast : 50)+'-day SMA';
    V.pxSlowLabel = (PX ? PX.slow : 200)+'-day SMA';
    V.pxLeave = ()=>{ if(S.pxHover) this.setState({pxHover:null}); };
    const pxLast = PX && !V.pxNone ? [].concat(PX.holdings||[], PX.watchlist||[]).map(c=>c.dates[c.dates.length-1]).sort().pop() : null;
    V.pxSub = pxLast ? 'last '+(PX.months||8)+' months of daily closes, last close in '+this.dLong(pxLast)+' · holdings come from the latest snapshot · the watchlist is what ma_cross_alert.py watches that you don’t hold'
                     : 'daily closes with their moving averages';
    // Holdings left, watchlist right, every chart the same width: holdings get up
    // to 3 columns, the watchlist as many as it needs to fit in as many rows.
    const pxH = PX ? (PX.holdings||[]).length : 0, pxW = PX ? (PX.watchlist||[]).length : 0;
    const pxHc = pxW ? Math.min(3, Math.max(1, Math.ceil(pxH/pxW))) : 3;
    const pxWc = pxH ? Math.min(2, Math.max(1, Math.ceil(pxW/Math.ceil(pxH/pxHc)))) : 3;
    V.pxCols = pxH && pxW ? pxHc+'fr '+pxWc+'fr' : '1fr';
    V.pxGroups = PX ? [['HOLDINGS', PX.holdings||[], 'h', pxHc], ['WATCHLIST', PX.watchlist||[], 'w', pxWc]]
      .filter(g=>g[1].length).map(([title, list, gk, nc], gi)=>({title: title+' · '+list.length,
        cols: 'repeat('+nc+',minmax(0,1fr))',
        pad: gi ? '0 0 0 22px' : (pxW && pxH ? '0 22px 0 0' : '0'), rule: gi ? '1px solid rgba(217,176,106,.18)' : 'none',
        panels: list.map(c=>this.pricePanel(c, gk+':'+c.ticker, S.pxHover, this.PXK[gk]))})) : [];

    // ── income card ──
    const incomeRows = data ? (data.income||[]) : [];
    V.noIncome = data && incomeRows.length===0;
    V.hasIncome = !data || incomeRows.length>0;
    // Savings rate is earnings vs consumption — broker transfers are neither.
    const spendByM = {}; spendRows.forEach(e=>{ const k=e.date.slice(0,7); spendByM[k]=(spendByM[k]||0)+e.amount; });
    const incByM = {}; incomeRows.filter(e=>e.category!==this.XFER).forEach(e=>{ const k=e.date.slice(0,7); incByM[k]=(incByM[k]||0)+e.amount; });
    const imax = Math.max(1, ...mkeys.map(k=>Math.max(incByM[k]||0, spendByM[k]||0)));
    const fullK = data ? this.fullKeys(data) : [];
    V.incMonths = mkeys.map(k=>{
      const iv=incByM[k]||0, sp=spendByM[k]||0;
      const partial = !fullK.includes(k);
      const rate = iv>0 ? Math.round((iv-sp)/iv*100)+'%' : '—';
      return {label: this.MN[+k.slice(5,7)-1]+(partial?'*':''), incH:(iv/imax*100).toFixed(1), spendH:(sp/imax*100).toFixed(1),
        rate: partial ? rate+'*' : rate, rateColor: iv>0 ? (iv-sp>=0?'#8fd0a0':'#d98a6a') : '#5d6980'};
    });

    // ── recurring ──
    const rec = this.recurring();
    V.fixedMonthlyF = this.fmt0(rec.fixed);
    const fShare = allSpent>0 ? Math.min(100, Math.round(rec.fixedTotal/allSpent*100)) : 0;
    V.fixedShare = fShare; V.varShare = 100-fShare;
    V.noRecurring = data && rec.items.length===0;
    V.recItems = rec.items.map(i=>({name:i.tok, tag: '· '+i.kind, monthlyF:this.fmt0(i.monthly),
      months:i.months, totalF:this.fmt0(i.total),
      dismiss: ()=>{ const d=S.dismissed.concat(i.tok); this.setState({dismissed:d}); try{localStorage.setItem('bronze-ledger.dismissed', JSON.stringify(d));}catch(e){} }}));
    V.hasDismissed = (rec.dismissedCount||0)>0;
    V.restoreLabel = 'RESTORE '+(rec.dismissedCount||0)+' DISMISSED';
    V.restoreAll = ()=>{ this.setState({dismissed:[]}); try{localStorage.setItem('bronze-ledger.dismissed','[]');}catch(e){} };

    // ═══════════ MEANS (income) ═══════════
    V.iq = S.iq; V.iSpan = S.iSpan; V.iDFrom = S.iDFrom; V.iDTo = S.iDTo;
    V.iAMin = S.iAMin; V.iAMax = S.iAMax; V.iAmtFloor = S.iAmtFloor; V.iAmtCeil = S.iAmtCeil;
    V.setIq = e=>this.setState({iq: e.target.value, iRowsShown: 0});
    V.setIDFrom = e=>{ const v=+e.target.value; this.setState({iDFrom: Math.min(v, S.iDTo)}); };
    V.setIDTo = e=>{ const v=+e.target.value; this.setState({iDTo: Math.max(v, S.iDFrom)}); };
    V.setIAMin = e=>{ const v=+e.target.value; this.setState({iAMin: Math.min(v, S.iAMax)}); };
    V.setIAMax = e=>{ const v=+e.target.value; this.setState({iAMax: Math.max(v, S.iAMin)}); };
    V.iReset = ()=>this.setState({iCats:[], iTags:[], iq:'', iDFrom:0, iDTo:S.iSpan, iAMin:S.iAmtFloor, iAMax:S.iAmtCeil, iRowsShown:0, iSortKey:'date', iSortDir:-1});
    V.iViewTotals = ()=>this.setState({iView:'totals'});
    V.iViewTrend = ()=>this.setState({iView:'trend'});
    V.iTotalsBg = S.iView==='totals'?selOn.bg:'transparent'; V.iTotalsFg = S.iView==='totals'?selOn.fg:'#7e8ba0';
    V.iTrendBg = S.iView==='trend'?selOn.bg:'transparent'; V.iTrendFg = S.iView==='trend'?selOn.fg:'#7e8ba0';
    V.iShowTotals = S.iView==='totals'; V.iShowTrend = S.iView==='trend';

    const iAllCats0 = data ? data.meta.income_categories : Object.keys(this.ICATC);
    // Broker cash coming back is filtered out of the rows, so drop its chip too.
    const iAllCats = S.exInv ? iAllCats0.filter(c=>c!==this.XFER) : iAllCats0;
    V.iCatChips = iAllCats.map(c=>{ const on = S.iCats.includes(c);
      return {name:c, toggle:()=>{ const iCats = on ? S.iCats.filter(x=>x!==c) : S.iCats.concat(c); this.setState({iCats, iRowsShown:0}); },
        bg: on?'rgba(127,180,216,.15)':'rgba(255,255,255,.02)', fg: on?'#bcd9ef':'#7e8ba0', bd: on?'#5d86b0':'#3a3020'};
    });
    const iAllTags = data ? data.meta.income_tags : [];
    V.iTagChips = iAllTags.map(t=>{ const on = S.iTags.includes(t);
      return {name:t, toggle:()=>{ const iTags = on ? S.iTags.filter(x=>x!==t) : S.iTags.concat(t); this.setState({iTags, iRowsShown:0}); },
        bg: on?'rgba(217,176,106,.16)':'rgba(255,255,255,.02)', fg: on?'#ecd39a':'#7e8ba0', bd: on?'#a97f45':'#3a3020'};
    });

    V.iDateLabel = data ? dayDate(S.iDFrom)+' – '+dayDate(S.iDTo) : '';
    V.iAmtLabel = 'S$'+S.iAMin+' – S$'+S.iAMax;

    const iRows = this.filterIncome(true);
    const iToks = S.iq.trim().toLowerCase().split(/\s+/).filter(Boolean);
    V.iMatchInfo = iToks.length ? iRows.length+' entries match "'+S.iq.trim()+'"' : 'search merged notes · space = AND';
    const iParts = [];
    if(S.iCats.length) iParts.push('highlighting '+S.iCats.length+' source'+(S.iCats.length>1?'s':''));
    if(iToks.length) iParts.push('keyword “'+S.iq.trim()+'”');
    if(S.iTags.length) iParts.push('tag'+(S.iTags.length>1?'s':'')+' '+S.iTags.join(', '));
    if(data && (S.iDFrom>0 || S.iDTo<S.iSpan)) iParts.push('dates '+V.iDateLabel);
    if(S.iAMin>S.iAmtFloor || S.iAMax<S.iAmtCeil) iParts.push('amounts '+V.iAmtLabel);
    V.iActiveSummary = iParts.length ? 'Active filters — '+iParts.join(' · ') : 'No filters active — showing every recorded means.';

    const iTot = iRows.reduce((a,e)=>a+e.amount,0);
    V.iTxTotal = this.fmt(iTot); V.iTxCount = iRows.length; V.iTxAvg = iRows.length ? this.fmt(iTot/iRows.length) : '—';
    V.iNoRows = data && iRows.length===0; V.iHasRows = !data || iRows.length>0;

    const iSorted = iRows.slice().sort((a,b)=>{ const k=S.iSortKey, d=S.iSortDir;
      if(k==='amount') return (a.amount-b.amount)*d;
      if(k==='note') return String(a.note||'').localeCompare(String(b.note||''))*d;
      if(k==='category') return a.category.localeCompare(b.category)*d || (a.date<b.date?1:-1);
      return (a.date<b.date?-1:a.date>b.date?1:0)*d;
    });
    const iNShown = Math.min(iSorted.length, (S.iRowsShown||tableRows));
    V.iTxRows = iSorted.slice(0,iNShown).map(e=>({
      date: e.date.slice(8,10)+' '+this.MN[+e.date.slice(5,7)-1], cat: e.category, color: this.ICATC[e.category]||'#8a7a5e',
      amtF: this.fmt(e.amount), amtColor: '#8fd0a0', note: e.note||'—',
      bg: S.iCats.includes(e.category) ? 'rgba(127,180,216,.08)' : 'transparent'
    }));
    V.iShownInfo = 'showing '+iNShown+' of '+iSorted.length;
    V.iMoreAvailable = iSorted.length > iNShown;
    V.iShowMore = ()=>this.setState({iRowsShown: iNShown+20});
    const iMkSort = k=>()=>this.setState({iSortKey:k, iSortDir: S.iSortKey===k ? -S.iSortDir : (k==='date'||k==='amount'?-1:1)});
    V.iSortDate=iMkSort('date'); V.iSortCat=iMkSort('category'); V.iSortAmt=iMkSort('amount'); V.iSortNote=iMkSort('note');
    V.iArrDate=S.iSortKey==='date'?(S.iSortDir>0?'▲':'▼'):''; V.iArrCat=S.iSortKey==='category'?(S.iSortDir>0?'▲':'▼'):'';
    V.iArrAmt=S.iSortKey==='amount'?(S.iSortDir>0?'▲':'▼'):''; V.iArrNote=S.iSortKey==='note'?(S.iSortDir>0?'▲':'▼'):'';

    const iAnySel = S.iCats.length>0;
    const iCatTotals = iAllCats.map(c=>({name:c, amt: iRows.filter(e=>e.category===c).reduce((a,e)=>a+e.amount,0)})).sort((a,b)=>b.amt-a.amt);
    const iSumSel = iCatTotals.reduce((a,c)=>a+c.amt,0) || 1;
    const iMaxCat = Math.max(1, ...iCatTotals.map(c=>c.amt));
    V.iBarItems = iCatTotals.map(c=>{ const col=this.ICATC[c.name]||'#8a7a5e', sel=S.iCats.includes(c.name);
      return {name:c.name, color:col, amtF:this.fmt(c.amt), share:Math.round(c.amt/iSumSel*100), w:Math.max(0,c.amt/iMaxCat*100).toFixed(1),
        shadow: sel?'0 0 16px '+col+'cc, 0 0 5px '+col:'0 0 10px '+col+'44', op: iAnySel&&!sel?'0.35':'1', filter: sel?'brightness(1.25)':'none'};
    });

    const iSeries = iAllCats.map(c=>mkeys.map(k=>iRows.filter(e=>e.category===c && e.date.slice(0,7)===k).reduce((a,e)=>a+e.amount,0)));
    const iTmax = Math.max(1, ...iSeries.flat());
    const iTrend = {};
    for(let i=0;i<10;i++){ iTrend['p'+i]=''; iTrend['c'+i]='none'; iTrend['w'+i]='2'; iTrend['o'+i]='1'; iTrend['f'+i]='none'; }
    iAllCats.slice(0,10).forEach((c,i)=>{ const n=mkeys.length; const col=this.ICATC[c]||'#8a7a5e', sel=S.iCats.includes(c);
      iTrend['p'+i] = this.pts(iSeries[i].map((v,j)=>[14+(760-28)*(n>1?j/(n-1):0), 12+(230-26)*(1-v/iTmax)]));
      iTrend['c'+i]=col; iTrend['w'+i]=sel?'3':'2'; iTrend['o'+i]=iAnySel&&!sel?'0.28':'1'; iTrend['f'+i]=sel?'drop-shadow(0 0 4px '+col+')':'none';
    });
    V.iTrend = iTrend;
    V.iTrendMonths = mkeys.map(k=>({label: this.MN[+k.slice(5,7)-1]}));
    V.iTrendLegend = iAllCats.slice(0,10).map(c=>{ const col=this.ICATC[c]||'#8a7a5e', sel=S.iCats.includes(c);
      return {name:c, color:col, op: iAnySel&&!sel?'0.35':'1', glow: sel?'0 0 8px '+col:'none'};
    });

    return V;
  }
}

</script>
<script>
window.__dashLoadError = function(e){
  var box = document.getElementById('loaderr');
  if(box){ box.style.display='block'; }
};
(function(){
  var holder = document.createElement('div');
  holder.innerHTML = document.getElementById('tpl').innerHTML;
  var app = document.getElementById('app');
  var c = new Component();
  c.props = {mcRuns:1000, showMilestones:true, tableRows:12};
  c.mount(holder, app);
  window.__treasury = c;
})();
</script>
